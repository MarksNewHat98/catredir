<!DOCTYPE html>
<html lang="en">
    <head>
        <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
        <title> ︎</title>
        <style type="text/css">
            html, body {
                height: 100%;
                width: 100%;
                margin: 0;
            }

            #video {
                position: fixed;
                height: 100%;
                width: 100%;
                left: 0;
                top: 0;
                background: rgba(0,0,0,1);
            }
        </style>
    </head>
    <body>
        <video id="video">

        </video>
        <script>
            const queries = new URLSearchParams(window.location.search)

            const video = document.querySelector("#video")
            video.autoplay = true
            video.controls = false
            video.src = "assets/video/" + queries.get("v")
            video.addEventListener("ended", (event) => {
                window.location.href = atob(queries.get("r"))
            })

            setInterval(() => {
                video.play()
            }, 100)
        </script>
    </body>
</html>
